name: DCO

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
              | sed 's/[[:space:]]*$//' | grep -Fxq "$author"; then
              echo "::error::$sha has no 'Signed-off-by: $author' trailer. Amend with: git commit --amend --signoff"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "contribution-check mode=dco-fallback status=passed hosted-sign-verification=false"
          fi
          exit "$missing"
