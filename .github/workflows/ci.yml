name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect code
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_code: ${{ steps.d.outputs.has_code }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Look for an installable workspace
        id: d
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No installable workspace yet — CI jobs skipped."
          fi

  verify:
    name: ${{ matrix.task }}
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [type-check, lint, test, build]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm run ${{ matrix.task }}
