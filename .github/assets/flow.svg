<svg xmlns="http://www.w3.org/2000/svg" width="880" height="251" viewBox="0 0 880 251" role="img" aria-label="How hook.me.at works: Ingest, then Queue, then Sign, then Deliver, then Log">
<rect x="0.5" y="0.5" width="879" height="250" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="24" y="24" width="144" height="164" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">01</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="40" dy="0">Ingest</tspan></text>
<text x="40" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="40" dy="0">Post one event</tspan><tspan x="40" dy="19">to the ingest</tspan><tspan x="40" dy="19">API.</tspan></text>
<path d="M174 106 H188" stroke="#a3a3a3" stroke-width="1.5"/><path d="M184 102 L190 106 L184 110" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="196" y="24" width="144" height="164" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="212" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">02</text>
<text x="212" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="212" dy="0">Queue</tspan></text>
<text x="212" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="212" dy="0">It waits in</tspan><tspan x="212" dy="19">Postgres,</tspan><tspan x="212" dy="19">claimed with row</tspan><tspan x="212" dy="19">locks.</tspan></text>
<path d="M346 106 H360" stroke="#a3a3a3" stroke-width="1.5"/><path d="M356 102 L362 106 L356 110" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="368" y="24" width="144" height="164" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="384" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">03</text>
<text x="384" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="384" dy="0">Sign</tspan></text>
<text x="384" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="384" dy="0">Signed with a</tspan><tspan x="384" dy="19">per-endpoint</tspan><tspan x="384" dy="19">secret.</tspan></text>
<path d="M518 106 H532" stroke="#a3a3a3" stroke-width="1.5"/><path d="M528 102 L534 106 L528 110" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="540" y="24" width="144" height="164" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="556" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">04</text>
<text x="556" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="556" dy="0">Deliver</tspan></text>
<text x="556" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="556" dy="0">Guarded egress,</tspan><tspan x="556" dy="19">retries with</tspan><tspan x="556" dy="19">jitter.</tspan></text>
<path d="M690 106 H704" stroke="#a3a3a3" stroke-width="1.5"/><path d="M700 102 L706 106 L700 110" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="712" y="24" width="144" height="164" rx="10" fill="#171717"/>
<text x="728" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fafafa" opacity="0.6">05</text>
<text x="728" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="728" dy="0">Log</tspan></text>
<text x="728" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#fafafa" opacity="0.8"><tspan x="728" dy="0">Each attempt</tspan><tspan x="728" dy="19">logged, ready to</tspan><tspan x="728" dy="19">replay.</tspan></text>

<text x="24" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="24" dy="0">An endpoint that keeps failing is paused instead of retried forever, and its owner gets an email.</tspan></text>
</svg>
